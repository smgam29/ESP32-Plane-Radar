# Tag a release (v1.0.0) to attach firmware to GitHub Releases.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Determine release version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.release_tag }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build and merge
        env:
          PLATFORMIO_BUILD_FLAGS: '-DPLANE_RADAR_VERSION=\"${{ env.VERSION }}\"'
        run: |
          pio run -e supermini
          pio run -t merge -e supermini

      - name: Package release files
        run: |
          python3 scripts/package_release.py \
            --version "${VERSION}" \
            --build-dir .pio/build/supermini \
            --output-dir dist

      - name: Build first-upgrade package and A4 guide
        run: |
          pip install reportlab==4.4.9
          python3 -m unittest discover -s test -p 'test_upgrade_installer.py'
          python3 scripts/build_upgrade_guide.py \
            --version "${VERSION}" \
            --output dist/Plane-Radar-Upgrade-Guide-A4.pdf
          python3 scripts/build_upgrade_package.py \
            --version "${VERSION}" \
            --build-dir .pio/build/supermini \
            --guide dist/Plane-Radar-Upgrade-Guide-A4.pdf \
            --output-dir dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
